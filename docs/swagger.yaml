basePath: /
definitions:
  model.ExchangeOps:
    properties:
      amount:
        type: integer
      from_currency:
        type: string
      to_currency:
        type: string
    required:
    - amount
    - from_currency
    - to_currency
    type: object
  model.WalletOps:
    properties:
      amount:
        type: integer
      currency:
        type: string
    required:
    - amount
    - currency
    type: object
info:
  contact: {}
  description: Command-line entry point for the gw-wallet application.
  title: gw-wallet
  version: "1.0"
paths:
  /auth:
    get:
      responses:
        "200":
          description: OK
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Authenticate a request
      tags:
      - auth
  /exchange:
    post:
      consumes:
      - application/json
      parameters:
      - description: Exchange details
        in: body
        name: operation
        required: true
